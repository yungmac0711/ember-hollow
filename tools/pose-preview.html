<!doctype html>
<!-- Dev tool: preview Wren / Biscuit procedural poses. Serve game/ and open
     /tools/pose-preview.html?who=wren&sit=1&speed=0&t=2&view=side -->
<html><head><meta charset="utf-8"><base href="../"><style>html,body{margin:0;background:#222}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head><body><canvas id="c" width="800" height="400"></canvas>
<script type="module">
import * as THREE from 'three';
import { loadScene, loadModel } from './src/assets.js';
import { WrenAnimator } from './src/companion/wren-anim.js';
import { BiscuitRig } from './src/entities/biscuit-rig.js';
import { liftCharacter } from './src/render/character-materials.js';
const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) ? +q.get(k) : d);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x30343a);
scene.add(new THREE.HemisphereLight(0x8aa0c0, 0x303030, 2.5));
const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(2, 4, 3); scene.add(dl);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshLambertMaterial({ color: 0x555555 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const who = q.get('who') || 'wren';
const views = { side: [3, 0.9, 0], front: [0, 0.9, 3], back: [0, 1, -3], q: [2.2, 1.4, 2.2] };
const cam = new THREE.PerspectiveCamera(35, 2, 0.05, 50);
let anim, rig;
if (who === 'wren') {
  const w = await loadScene('companion'); const h = await loadScene('companionHood');
  scene.add(w.root);
  anim = new WrenAnimator(w.root, q.get('hood') === '1' ? h.root.getObjectByName('hood_up') : (q.has('hood') ? h.root.getObjectByName('hood_up') : null));
  if (q.get('hood') === '1') anim.setHood(true, true);
  liftCharacter(w.root);
  const s = { speed: num('speed', 0), sit: q.get('sit') === '1', look: num('look', 0), turnRate: 0 };
  const T = num('t', 2); for (let t = 0; t < T; t += 1 / 60) anim.update(1 / 60, s);
} else {
  const m = await loadModel('puppy', () => ({ root: new THREE.Group() }));
  scene.add(m.root); rig = new BiscuitRig(m.root); liftCharacter(m.root);
  const s = { pose: q.get('pose') || 'stand', speed: num('speed', 0), wag: num('wag', 1), tail: q.get('tail') || 'happy', pant: num('pant', 0), tilt: 0, sniff: 0 };
  const T = num('t', 3); for (let t = 0; t < T; t += 1 / 60) rig.update(1 / 60, s);
}
const v = views[q.get('view') || 'side']; const zoom = who === 'wren' ? 1 : 0.55;
cam.position.set(v[0] * zoom, v[1] * (who === 'wren' ? 1 : 0.5), v[2] * zoom); cam.lookAt(0, who === 'wren' ? 0.8 : 0.3, 0);
r.render(scene, cam); window.done = true;
</script></body></html>
